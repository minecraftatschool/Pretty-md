<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blocky Puzzle</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
html, body { height: 100%; margin: 0; }
body { background: #1f4b43; color: #f3ead5; overflow: hidden; touch-action: none;
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#canvas { display: block; width: 100%; height: 100%; outline: none; background: #1f4b43; }
#status { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; background: #1f4b43; text-align: center; padding: 0 16px; }
#status[hidden] { display: none; }
#status h1 { font-size: 44px; font-weight: 900; letter-spacing: .02em; margin: 0 0 18px; text-shadow: 0 4px 0 #1c1a17; }
#status h1 span { color: #f2b632; }
#bar { width: 280px; max-width: 70vw; height: 18px; border: 4px solid #1c1a17; border-radius: 12px; background: #1c1a17; overflow: hidden; }
#fill { width: 2%; height: 100%; background: #f2b632; border-radius: 8px; transition: width .15s; }
#note { font-size: 15px; font-weight: 700; margin-top: 18px; min-height: 1.4em; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0">This game needs a browser with WebGL.</canvas>
<div id="status">
  <h1>BLOCKY <span>PUZZLE</span></h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="note">Loading...</div>
</div>
<script src="index.js"></script>
<script>
(function () {
  var note = document.getElementById("note"), fill = document.getElementById("fill"), status = document.getElementById("status");
  var sdk = null;                      // set once the CrazyGames SDK has initialised
  window.cgMuted = false;              // the game polls this and mutes its audio
  // The game calls this with: gameplayStart, gameplayStop, happytime. No ad calls are made anywhere.
  var loadingDone = false;
  window.cgEvent = function (name) {
    if (name === "loadingStop") { if (loadingDone) return; loadingDone = true; }
    if (name === "gameplayStart" && !loadingDone) window.cgEvent("loadingStop");   // loading always ends before play begins
    try { if (sdk && sdk.game && typeof sdk.game[name] === "function") sdk.game[name](); } catch (e) {}
  };
  // Progress save through the CrazyGames Data module (enable "Progress Save" when submitting).
  window.cgSave = function (text) { try { if (sdk && sdk.data) sdk.data.setItem("save", text); } catch (e) {} };
  window.cgLoad = function () { try { return sdk && sdk.data ? sdk.data.getItem("save") : null; } catch (e) { return null; } };
  // Keep the page still under the game: no wheel or key scrolling, no context menu.
  window.addEventListener("wheel", function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener("keydown", function (e) { if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(e.key) >= 0) e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  function applySettings(s) { window.cgMuted = !!(s && s.muteAudio); }
  function initSdk() {
    if (!window.CrazyGames || !window.CrazyGames.SDK) return Promise.resolve();
    return Promise.resolve().then(function () { return window.CrazyGames.SDK.init(); }).then(function () {
      if (window.CrazyGames.SDK.environment === "disabled") return;   // not on CrazyGames: every SDK call would throw
      sdk = window.CrazyGames.SDK;
      try { applySettings(sdk.game.settings); sdk.game.addSettingsChangeListener(applySettings); } catch (e) {}
      window.cgEvent("loadingStart");
    }).catch(function () { sdk = null; });   // outside CrazyGames the game simply runs without the SDK
  }
  function fail(msg) { note.textContent = msg; fill.style.background = "#e8503a"; }
  var CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":629568,"index.wasm":19761972},"focusCanvas":true,"gdnativeLibs":[]};
  if (typeof Engine === "undefined") { fail("The game engine script did not load."); return; }
  var probe = document.createElement("canvas");
  if (!(probe.getContext("webgl") || probe.getContext("experimental-webgl"))) { fail("WebGL is turned off in this browser, so the game cannot draw."); return; }
  initSdk().then(function () {
    var engine = new Engine(CONFIG);
    return engine.startGame({
      onProgress: function (cur, total) { if (total > 0) fill.style.width = Math.max(2, Math.round(cur / total * 100)) + "%"; }
    });
  }).then(function () { status.hidden = true; window.cgEvent("loadingStop"); }, function (err) {
    fail("The game could not start: " + (err && err.message ? err.message : err));
  });
})();
</script>
</body>
</html>
