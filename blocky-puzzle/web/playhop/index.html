<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blocky Puzzle</title>
<!-- Yandex Games SDK (Playhop is served through Yandex Games). The path is relative to the host, as their docs require for uploaded archives. -->
<script src="/sdk.js"></script>
<style>
html, body { height: 100%; margin: 0; }
body { background: #1f4b43; color: #f3ead5; overflow: hidden; touch-action: none; overscroll-behavior: none;
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#canvas { display: block; width: 100%; height: 100%; outline: none; background: #1f4b43; }
#status { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; background: #6b4226; text-align: center; padding: 0 16px; }
#status[hidden] { display: none; }
#status h1 { font-size: 44px; font-weight: 900; letter-spacing: .02em; margin: 0 0 18px; text-shadow: 0 4px 0 #1c1a17; }
#status h1 span { color: #f2b632; }
#bar { width: 280px; max-width: 70vw; height: 18px; border: 4px solid #1c1a17; border-radius: 12px; background: #1c1a17; overflow: hidden; }
#fill { width: 2%; height: 100%; background: #f2b632; border-radius: 8px; transition: width .15s; }
#note { font-size: 15px; font-weight: 700; margin-top: 18px; min-height: 1.4em; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0">This game needs a browser with WebGL.</canvas>
<div id="status">
  <h1>Seh's Workshop</h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="note">Loading...</div>
</div>
<script src="index.js"></script>
<script>
(function () {
  var note = document.getElementById("note"), fill = document.getElementById("fill"), status = document.getElementById("status");
  var ysdk = null, player = null, cloudSave = null, saveTimer = 0, pendingSave = null;
  var readySent = false, playing = false;
  var st = { sdkPause: false, hidden: false, ad: false };
  window.cgPortal = "playhop";
  window.cgMuted = false;   // the game polls these two
  window.cgPaused = false;
  function refresh() { var q = st.sdkPause || st.hidden || st.ad; window.cgMuted = q; window.cgPaused = q; }

  // Sound and play stop whenever the game is not in front of the player.
  document.addEventListener("visibilitychange", function () { st.hidden = document.hidden; refresh(); });
  window.addEventListener("blur", function () { st.hidden = true; refresh(); });
  window.addEventListener("focus", function () { st.hidden = document.hidden; refresh(); });
  // Keep the page still under the game.
  window.addEventListener("wheel", function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener("keydown", function (e) { if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(e.key) >= 0) e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  function sdkCall(fn) { try { if (ysdk) fn(); } catch (e) {} }

  // Events from the game: loadingStop, gameplayStart, gameplayStop, happytime, adBreak.
  window.cgEvent = function (name) {
    if (name === "loadingStop") {
      if (readySent) return;
      readySent = true;
      sdkCall(function () { ysdk.features.LoadingAPI.ready(); });
    } else if (name === "gameplayStart") {
      if (!readySent) window.cgEvent("loadingStop");
      if (!playing) { playing = true; sdkCall(function () { ysdk.features.GameplayAPI.start(); }); }
    } else if (name === "gameplayStop") {
      if (playing) { playing = false; sdkCall(function () { ysdk.features.GameplayAPI.stop(); }); }
    } else if (name === "adBreak") {
      // The only ad placement: between two games, after the player taps Play Again.
      // To ship with no ad calls at all, delete this branch.
      sdkCall(function () {
        ysdk.adv.showFullscreenAdv({ callbacks: {
          onOpen: function () { st.ad = true; refresh(); },
          onClose: function () { st.ad = false; refresh(); },
          onError: function () { st.ad = false; refresh(); }
        } });
      });
    }
  };

  // Progress: Yandex player data when available, with the browser's own storage as a second copy.
  function localGet() { try { return localStorage.getItem("blocky_save"); } catch (e) { return null; } }
  function localSet(t) { try { localStorage.setItem("blocky_save", t); } catch (e) {} }
  window.cgLoad = function () { return cloudSave || localGet(); };
  window.cgSave = function (text) {
    localSet(text);
    if (!player) return;
    pendingSave = text;
    if (saveTimer) return;                       // at most one cloud write every 3 seconds
    saveTimer = setTimeout(function () {
      saveTimer = 0;
      var t = pendingSave; pendingSave = null;
      try { player.setData({ save: t }, true).catch(function () {}); } catch (e) {}
    }, 3000);
  };

  function initSdk() {
    if (typeof YaGames === "undefined") return Promise.resolve();   // opened outside the portal
    return YaGames.init().then(function (sdk) {
      ysdk = sdk;
      try { window.cgLang = ysdk.environment.i18n.lang; document.documentElement.lang = "en"; } catch (e) {}
      try {
        ysdk.on("game_api_pause", function () { st.sdkPause = true; refresh(); });
        ysdk.on("game_api_resume", function () { st.sdkPause = false; refresh(); });
      } catch (e) {}
      return ysdk.getPlayer().then(function (p) {
        player = p;
        return p.getData(["save"]);
      }).then(function (d) {
        if (d && typeof d.save === "string" && d.save.length) cloudSave = d.save;
      }).catch(function () { player = null; });
    }).catch(function () { ysdk = null; });
  }

  function fail(msg) { note.textContent = msg; fill.style.background = "#e8503a"; }
  var CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1673840,"index.wasm":19761972},"focusCanvas":true,"gdnativeLibs":[]};
  if (typeof Engine === "undefined") { fail("The game engine script did not load."); return; }
  var probe = document.createElement("canvas");
  if (!(probe.getContext("webgl") || probe.getContext("experimental-webgl"))) { fail("WebGL is turned off in this browser, so the game cannot draw."); return; }
  initSdk().then(function () {
    var engine = new Engine(CONFIG);
    return engine.startGame({
      onProgress: function (cur, total) { if (total > 0) fill.style.width = Math.max(2, Math.round(cur / total * 100)) + "%"; }
    });
  }).then(function () { status.hidden = true; window.cgEvent("loadingStop"); }, function (err) {
    fail("The game could not start: " + (err && err.message ? err.message : err));
  });
})();
</script>
</body>
</html>
